<!DOCTYPE html>                                                                                                                                                                                                                                                                                                            
  <html lang="ru">
  <head>                                                                                                                                                                                                                                                                                                                     
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming soon</title>                                                                                                                                                                                                                                                                                               
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }                                                                                                                                                                                                                                                                   
                       
      body {
        min-height: 100vh;
        display: flex;                                                                                                                                                                                                                                                                                                       
        align-items: center;
        justify-content: center;                                                                                                                                                                                                                                                                                             
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0e0e0e;                                                                                                                                                                                                                                                                                                 
        color: #f0f0f0;
        text-align: center;                                                                                                                                                                                                                                                                                                  
        padding: 2rem; 
      }

      h1 {                                                                                                                                                                                                                                                                                                                   
        font-size: clamp(2rem, 6vw, 3.5rem);
        font-weight: 300;                                                                                                                                                                                                                                                                                                    
        letter-spacing: -0.02em;                            
        margin-bottom: 1rem;                                                                                                                                                                                                                                                                                                 
      }
                                                                                                                                                                                                                                                                                                                             
      p {                                                   
        color: #888;
        font-size: 1rem;
      }

      .dot {
        display: inline-block;
        width: 8px;                                                                                                                                                                                                                                                                                                          
        height: 8px;
        background: #f0f0f0;                                                                                                                                                                                                                                                                                                 
        border-radius: 50%;                                 
        margin-left: 4px;
        animation: blink 1.2s infinite;
      }                                                                                                                                                                                                                                                                                                                      
   
      @keyframes blink {                                                                                                                                                                                                                                                                                                     
        0%, 100% { opacity: 1; }                            
        50%      { opacity: 0.2; }
      }                                                                                                                                                                                                                                                                                                                      
    </style>
  </head>                                                                                                                                                                                                                                                                                                                    
  <body>                                                    
    <main>
      <h1>Coming soon<span class="dot"></span></h1>
    </main> 

  <script type="text/javascript">
        const FUELMAN_EMBEDDED_ORIGIN =
                "https://fleetcorna--dev3.sandbox.my.site.com";

        const LOCATION_REQUEST_MESSAGE = "fuelman:geolocation:request";
        const LOCATION_RESPONSE_MESSAGE = "fuelman:geolocation:response";
        const LOCATION_BRIDGE_VERSION = 1;

        function sendLocationResponse(event, payload) {
                event.source.postMessage(
                        {
                                type: LOCATION_RESPONSE_MESSAGE,
                                version: LOCATION_BRIDGE_VERSION,
                                requestId: event.data.requestId,
                                ...payload
                        },
                        event.origin
                );
        }

        function handleFuelmanLocationRequest(event) {
                const request = event.data;

                if (
                        event.origin !== FUELMAN_EMBEDDED_ORIGIN ||
                        request?.type !== LOCATION_REQUEST_MESSAGE ||
                        request.version !== LOCATION_BRIDGE_VERSION ||
                        typeof request.requestId !== "string" ||
                        request.requestId.length === 0 ||
                        typeof event.source?.postMessage !== "function"
                ) {
                        return;
                }

                const messagingFrame = document.getElementById(
                        "embeddedMessagingFrame"
                );

                if (
                        messagingFrame &&
                        event.source !== messagingFrame.contentWindow
                ) {
                        return;
                }

                if (!window.isSecureContext || !navigator.geolocation) {
                        sendLocationResponse(event, {
                                success: false,
                                errorCode: 2
                        });
                        return;
                }

                navigator.geolocation.getCurrentPosition(
                        (position) => {
                                sendLocationResponse(event, {
                                        success: true,
                                        latitude: position.coords.latitude,
                                        longitude: position.coords.longitude
                                });
                        },
                        (error) => {
                                sendLocationResponse(event, {
                                        success: false,
                                        errorCode: error.code
                                });
                        },
                        {
                                enableHighAccuracy: false,
                                timeout: 10000,
                                maximumAge: 60000
                        }
                );
        }

        window.addEventListener(
                "message",
                handleFuelmanLocationRequest
        );

        function initEmbeddedMessaging() {
                try {
                        embeddedservice_bootstrap.settings.language = "en_US";

                        embeddedservice_bootstrap.init(
                                "00DSu000008Dmjl",
                                "Fuelman",
                                "https://fleetcorna--dev3.sandbox.my.site.com/ESWFuelman1786796833810",
                                {
                                        scrt2URL:
                                                "https://fleetcorna--dev3.sandbox.my.salesforce-scrt.com"
                                }
                        );
                } catch (err) {
                        console.error(
                                "Error loading Embedded Messaging:",
                                err
                        );
                }
        }
  </script>

  <script
        type="text/javascript"
        src="https://fleetcorna--dev3.sandbox.my.site.com/ESWFuelman1786796833810/assets/js/bootstrap.min.js"
        onload="initEmbeddedMessaging()"
  ></script>                                                                                                                                                                                                           
  </body>
  </html>
