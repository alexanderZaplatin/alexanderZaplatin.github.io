    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming soon</title>                                                                                                                                                                                                                                                                                               
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }                                                                                                                                                                                                                                                                   
                       
      body {  
        min-height: 100vh;
        display: flex;                                                                                                                                                                                                                                                                                                       
        align-items: center;
        justify-content: center;

      h1 {                                                                                                                                                                                                                                                                                                                   
        font-size: clamp(2rem, 6vw, 3.5rem);

        letter-spacing: -0.02em;

      .dot {
        display: inline-block;

  <body>                                                    
    <main>
      <h1>Coming soon<span class="dot"></span></h1>
    </main> 

<script type='text/javascript'>
  (() => {
    const LOCATION_REQUEST_MESSAGE = 'fuelman:geolocation:request';
    const LOCATION_RESPONSE_MESSAGE = 'fuelman:geolocation:response';
    const LOCATION_BRIDGE_VERSION = 1;
    const GEOLOCATION_OPTIONS = {
      enableHighAccuracy: false,
      timeout: 10000,
      maximumAge: 300000
    };

    window.addEventListener('message', event => {
      const request = event.data;

      if (
        request?.type !== LOCATION_REQUEST_MESSAGE ||
        request.version !== LOCATION_BRIDGE_VERSION ||
        typeof request.requestId !== 'string' ||
        !request.requestId ||
        !event.source
      ) {
        return;
      }

      const sendResponse = response => {
        event.source.postMessage(
          {
            type: LOCATION_RESPONSE_MESSAGE,
            version: LOCATION_BRIDGE_VERSION,
            requestId: request.requestId,
            ...response
          },
          event.origin
        );
      };

      if (!navigator.geolocation) {
        sendResponse({ success: false, errorCode: 'UNSUPPORTED' });
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          sendResponse({
            success: true,
            latitude: position.coords.latitude,
            longitude: position.coords.longitude
          });
        },
        error => {
          sendResponse({
            success: false,
            errorCode: error?.code || 'UNKNOWN'
          });
        },
        GEOLOCATION_OPTIONS
      );
    });
  })();

  window.addEventListener('onEmbeddedMessagingReady', () => {
    let visitor_id;
    try {
      const storedId = window.localStorage.getItem('visitor_id');
      const isValidId = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}(?![\s\S])/i.test(storedId ?? '');
      if (isValidId) {
        visitor_id = storedId;
      } else {
        if (storedId) {
          console.warn('Invalid stored visitor_id; replacing it with a new UUID.');
        }

        const newId = window.crypto.randomUUID();
        visitor_id = newId;
        window.localStorage.setItem('visitor_id', newId);
      }
    } catch {
      console.warn('Unable to persist visitor_id; continuing without visitor identification.');
    }

    try {
      const params = new URLSearchParams(window.location.search);
      const hiddenFields = {
        utm_source: '',
        utm_medium: '',
        utm_campaign: '',
        utm_term: '',
        utm_content: ''
      };

      for (const [key, value] of params.entries()) {
        const k = key.toLowerCase();

        if (k in hiddenFields && !hiddenFields[k]) {
          hiddenFields[k] = value;
        }
      }

      if (visitor_id) {
        hiddenFields.visitor_id = visitor_id;
      }

      embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields(hiddenFields);
    } catch (err) {
      console.error('Error setting hidden prechat fields: ', err);
    }
  });

  function isDesktop() {
    return window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  }

  const AGENT_AUTOLAUNCH_COOKIE = 'fuelman_agent_autolaunch_handled';
  let isWithinBusinessHours = false;
  let isButtonCreated = false;
  let autoLaunchTimerId;

  function saveAgentAutolaunchHandled() {
    document.cookie =
      ${AGENT_AUTOLAUNCH_COOKIE}=1; Path=/; SameSite=Lax; Secure;
  }

  function isAgentAutolaunchHandled() {
    return document.cookie
      .split('; ')
      .some(cookie => cookie === ${AGENT_AUTOLAUNCH_COOKIE}=1);
  }

  function clearAgentAutolaunchHandled() {
    document.cookie =
      ${AGENT_AUTOLAUNCH_COOKIE}=; Path=/; Max-Age=0; SameSite=Lax; Secure;
  }

  function cancelPendingAutoLaunch() {
    if (autoLaunchTimerId === undefined) {
      return;
    }

    window.clearTimeout(autoLaunchTimerId);
    autoLaunchTimerId = undefined;
  }

  function handleManualChatAction() {
    saveAgentAutolaunchHandled();
    cancelPendingAutoLaunch();
  }

  function scheduleAutoLaunchWhenReady() {
    if (
      !isWithinBusinessHours ||
      !isButtonCreated ||
      !isDesktop() ||
      isAgentAutolaunchHandled() ||
      autoLaunchTimerId !== undefined
    ) {
      return;
    }

    autoLaunchTimerId = window.setTimeout(() => {
      autoLaunchTimerId = undefined;

      if (
        !isWithinBusinessHours ||
        !isDesktop() ||
        isAgentAutolaunchHandled()
      ) {
        return;
      }

      saveAgentAutolaunchHandled();

      try {
        embeddedservice_bootstrap.utilAPI.launchChat()
          .then(() => console.log('Chat launched'))
          .catch(error => {
            clearAgentAutolaunchHandled();
            console.error('launchChat failed:', error);
          });
      } catch (err) {
        clearAgentAutolaunchHandled();
        console.error('Error launching chat: ', err);
      }
    }, 5000);
  }

  window.addEventListener('onEmbeddedMessagingWithinBusinessHours', () => {
    isWithinBusinessHours = true;
    scheduleAutoLaunchWhenReady();
  });

  window.addEventListener('onEmbeddedMessagingButtonCreated', () => {
    isButtonCreated = true;
    scheduleAutoLaunchWhenReady();
  });

  window.addEventListener(
    'onEmbeddedMessagingButtonClicked',
    handleManualChatAction
  );

  window.addEventListener(
    'onEmbeddedMessagingWindowMinimized',
    handleManualChatAction
  );

  window.addEventListener(
    'onEmbeddedMessagingWindowClosed',
    handleManualChatAction
  );

  function initEmbeddedMessaging() {
    try {
      embeddedservice_bootstrap.settings.language = 'en_US';

      embeddedservice_bootstrap.init(
        '00DSu000008Dmjl',
        'Fuelman',
        'https://fleetcorna--dev3.sandbox.my.site.com/ESWFuelman1786796833810',
        {
          scrt2URL: 'https://fleetcorna--dev3.sandbox.my.salesforce-scrt.com'
        }
      );
    } catch (err) {
      console.error('Error loading Embedded Messaging: ', err);
    }
  }
</script>

<script
  type='text/javascript'
  src='https://fleetcorna--dev3.sandbox.my.site.com/ESWFuelman1786796833810/assets/js/bootstrap.min.js'

</script>
