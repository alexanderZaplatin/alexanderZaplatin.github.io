<!DOCTYPE html>                                                                                                                                                                                                                                                                                                            
  <html lang="ru">
  <head>                                                                                                                                                                                                                                                                                                                     
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming soon</title>                                                                                                                                                                                                                                                                                               
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }                                                                                                                                                                                                                                                                   
                       
      body {  
        min-height: 100vh;
        display: flex;                                                                                                                                                                                                                                                                                                       
        align-items: center;
        justify-content: center;                                                                                                                                                                                                                                                                                             
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0e0e0e;                                                                                                                                                                                                                                                                                                 
        color: #f0f0f0;
        text-align: center;                                                                                                                                                                                                                                                                                                  
        padding: 2rem; 
      }

      h1 {                                                                                                                                                                                                                                                                                                                   
        font-size: clamp(2rem, 6vw, 3.5rem);
        font-weight: 300;                                                                                                                                                                                                                                                                                                    
        letter-spacing: -0.02em;                            
        margin-bottom: 1rem;                                                                                                                                                                                                                                                                                                 
      }
                                                                                                                                                                                                                                                                                                                             
      p {                                                   
        color: #888;
        font-size: 1rem;
      }

      .dot {
        display: inline-block;
        width: 8px;                                                                                                                                                                                                                                                                                                          
        height: 8px;
        background: #f0f0f0;                                                                                                                                                                                                                                                                                                 
        border-radius: 50%;                                 
        margin-left: 4px;
        animation: blink 1.2s infinite;
      }                                                                                                                                                                                                                                                                                                                      
   
      @keyframes blink {                                                                                                                                                                                                                                                                                                     
        0%, 100% { opacity: 1; }                            
        50%      { opacity: 0.2; }
      }                                                                                                                                                                                                                                                                                                                      
    </style>
  </head>                                                                                                                                                                                                                                                                                                                    
  <body>                                                    
    <main>
      <h1>Coming soon<span class="dot"></span></h1>
    </main> 

  <script type='text/javascript'>
    (() => {
      const LOCATION_REQUEST_MESSAGE = 'fuelman:geolocation:request';
      const LOCATION_RESPONSE_MESSAGE = 'fuelman:geolocation:response';
      const LOCATION_BRIDGE_VERSION = 1;

      const GEOLOCATION_OPTIONS = {
        enableHighAccuracy: false,
        timeout: 4500,
        maximumAge: 300000
      };

      let cachedLocation;
      let pendingLocationRequest;
      let hiddenPrechatFields;
      let chatLaunchStarted = false;

      function isDesktop() {
        return window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      }

      function requestCurrentLocation() {
        if (cachedLocation) {
          return Promise.resolve(cachedLocation);
        }

        if (pendingLocationRequest) {
          return pendingLocationRequest;
        }

        if (!navigator.geolocation) {
          return Promise.reject({ code: 'UNSUPPORTED' });
        }

        const currentRequest = new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(
            position => {
              cachedLocation = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude
              };
              resolve(cachedLocation);
            },
            reject,
            GEOLOCATION_OPTIONS
          );
        });

        pendingLocationRequest = currentRequest;

        currentRequest.then(
          () => {
            if (pendingLocationRequest === currentRequest) {
              pendingLocationRequest = undefined;
            }
          },
          () => {
            if (pendingLocationRequest === currentRequest) {
              pendingLocationRequest = undefined;
            }
          }
        );

        return currentRequest;
      }

      function buildHiddenPrechatFields() {
        const hiddenFields = {
          utm_source: '',
          utm_medium: '',
          utm_campaign: '',
          utm_term: '',
          utm_content: '',
          user_latitude: '',
          user_longitude: ''
        };

        const params = new URLSearchParams(window.location.search);

        for (const [key, value] of params.entries()) {
          const k = key.toLowerCase();

          // case-insensitive param name match; first occurrence wins
          if (k in hiddenFields && !hiddenFields[k]) {
            hiddenFields[k] = value;
          }
        }

        return hiddenFields;
      }

      function setHiddenPrechatFields() {
        if (chatLaunchStarted || !hiddenPrechatFields) {
          return;
        }

        embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields(
          hiddenPrechatFields
        );
      }

      //── listener: hidden pre-chat fields and browser location ──
      window.addEventListener('onEmbeddedMessagingReady', () => {
        try {
          hiddenPrechatFields = buildHiddenPrechatFields();
          setHiddenPrechatFields();

          requestCurrentLocation()
            .then(location => {
              if (chatLaunchStarted) {
                return;
              }

              hiddenPrechatFields.user_latitude = String(location.latitude);
              hiddenPrechatFields.user_longitude = String(location.longitude);
              setHiddenPrechatFields();
            })
            .catch(error => {
              console.info(
                'Browser location was not added to pre-chat fields:',
                error?.code || 'UNKNOWN'
              );
            });
        } catch (err) {
          console.error('Error setting hidden prechat fields: ', err);
        }
      });

      //── fallback bridge for the Share current location CLT ──
      window.addEventListener('message', event => {
        const request = event.data;

        if (
          request?.type !== LOCATION_REQUEST_MESSAGE ||
          request.version !== LOCATION_BRIDGE_VERSION ||
          typeof request.requestId !== 'string' ||
          !request.requestId ||
          !event.source
        ) {
          return;
        }

        const sendResponse = response => {
          event.source.postMessage(
            {
              type: LOCATION_RESPONSE_MESSAGE,
              version: LOCATION_BRIDGE_VERSION,
              requestId: request.requestId,
              ...response
            },
            event.origin
          );
        };

        requestCurrentLocation().then(
          location => {
            sendResponse({
              success: true,
              latitude: location.latitude,
              longitude: location.longitude
            });
          },
          error => {
            sendResponse({
              success: false,
              errorCode: error?.code || 'UNKNOWN'
            });
          }
        );
      });

      //── listener: auto-launch chat on desktop ──
      window.addEventListener('onEmbeddedMessagingButtonCreated', () => {
        if (!isDesktop()) {
          return;
        }

        setTimeout(() => {
          try {
            chatLaunchStarted = true;

            embeddedservice_bootstrap.utilAPI.launchChat()
              .then(() => console.log('Chat launched'))
              .catch(error => console.error('launchChat failed:', error));
          } catch (err) {
            console.error('Error launching chat: ', err);
          }
        }, 5000);
      });
    })();

    function initEmbeddedMessaging() {
      try {
        embeddedservice_bootstrap.settings.language = 'en_US';

        embeddedservice_bootstrap.init(
          '00DRT000009Sxcf',
          'Test_CLT_Alex',
          'https://fleetcorna--qa.sandbox.my.site.com/ESWTestCLTAlex1786962653538',
          {
            scrt2URL:
              'https://fleetcorna--qa.sandbox.my.salesforce-scrt.com'
          }
        );
      } catch (err) {
        console.error('Error loading Embedded Messaging: ', err);
      }
    }
  </script>

<script type='text/javascript' src='https://fleetcorna--qa.sandbox.my.site.com/ESWTestCLTAlex1786962653538/assets/js/bootstrap.min.js' onload='initEmbeddedMessaging()'></script>                                                                                                                                                                                                   
  </body>
  </html>
